name: zdd

x-app-image: &app-image ${APP_IMAGE:-zdd-app}:${APP_TAG:-v1}

x-app-env: &app-env
  DATABASE_URL: postgres://demo:demo@postgres:5432/demo?sslmode=disable
  REDIS_ADDR: redis:6379
  VERSION: ${APP_TAG:-v1}

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      # Only containers that opt in with traefik.enable=true are routed.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # Dashboard + API. The rollout script reads backend health from it.
      # Bound to localhost below; never expose it publicly.
      - --api.insecure=true
      # JSON access log: the tests count 5xx here, on the server side.
      - --accesslog=true
      - --accesslog.format=json
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_PORT:-8080}:80"
      - "127.0.0.1:${DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  api:
    image: *app-image
    command: ["http"]
    restart: unless-stopped
    deploy:
      replicas: 2 # never 1: a single replica cannot be replaced without a gap
    environment:
      <<: *app-env
      TEST_HOOKS: "true" # /slow + crash-on-SIGUSR1, turn off in production
      FAIL_READY: ${FAIL_READY:-false} # test hook, simulates a broken release
      WARMUP_DELAY: 2s
      SHUTDOWN_DELAY: 4s # must be > Traefik health check interval x 2
      SHUTDOWN_TIMEOUT: 25s # must be > your slowest request
      RATE_LIMIT: "20"
    # SIGTERM -> SIGKILL window. Must be > SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT.
    stop_grace_period: 35s
    # Gate 1: Traefik ignores a container until Docker reports it healthy, so
    # a new replica gets no traffic while it is still starting.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 20s
      start_interval: 1s
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.middlewares=api-retry
      - traefik.http.services.api.loadbalancer.server.port=8080
      # Gate 2: Traefik's own check. It takes a replica out of rotation within
      # about a second of /ready failing, which is what makes shutdown clean.
      - traefik.http.services.api.loadbalancer.healthcheck.path=/ready
      - traefik.http.services.api.loadbalancer.healthcheck.interval=1s
      - traefik.http.services.api.loadbalancer.healthcheck.timeout=1s
      # Safety net: if a request cannot reach a replica at all (it just died),
      # try another one instead of answering 502.
      - traefik.http.middlewares.api-retry.retry.attempts=4
      - traefik.http.middlewares.api-retry.retry.initialinterval=100ms
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Background job. Exactly one replica, and not behind the proxy.
  worker:
    image: *app-image
    command: ["worker"]
    restart: unless-stopped
    environment: *app-env
    stop_grace_period: 35s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # One-shot. Runs on first `up`; the rollout script runs it before each deploy.
  migrate:
    image: *app-image
    command: ["migrate"]
    restart: "no"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres_data:
