name: zero-downtime test

# Runs every deploy scenario under load. A scenario fails if a single request
# fails, so a green run is the proof that deploys are still zero-downtime.

on:
  # No pull_request trigger on purpose: this runs on a self-hosted runner, and
  # on a public repository a pull request from a fork could run its own code
  # on that machine.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: zero-downtime-test # scenarios share ports and one machine
  cancel-in-progress: false

env:
  # Bind to localhost and stay clear of ports the host may already use.
  PROXY_BIND: 127.0.0.1
  PROXY_PORT: "18080"
  DASHBOARD_PORT: "18081"

jobs:
  scenario:
    runs-on: self-hosted
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario: [good-deploy, bad-deploy, scale, ratelimit, kill-container, naive-deploy]
    steps:
      - uses: actions/checkout@v4

      # k6 is optional: without it the scenarios run k6 from its Docker image.
      - uses: grafana/setup-k6-action@v1

      - name: Run ${{ matrix.scenario }}
        run: make test-${{ matrix.scenario }}

      - name: Container logs (on failure)
        if: failure()
        run: cd deploy && docker compose logs --tail 200 api worker migrate

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.scenario }}
          path: results/

      - name: Tear down
        if: always()
        run: make down
